<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marco Live</title>
<style>
@font-face{font-family:"Inter Tight";font-weight:400 600;src:url("assets/InterTight-latin.woff2") format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400 700;src:url("assets/JetBrainsMono-latin.woff2") format("woff2")}
:root{
--bg:oklch(0.122 0.014 268);--ink:oklch(0.96 0.004 265);--body:oklch(0.8 0.008 265);--muted:oklch(0.66 0.012 265);--dim:oklch(0.52 0.012 265);
--line:oklch(1 0 0 / 0.09);--line2:oklch(1 0 0 / 0.16);
--accent:oklch(0.72 0.185 264);--accent-soft:oklch(0.72 0.185 264 / 0.12);
--catch:oklch(0.82 0.15 75);--catch-soft:oklch(0.82 0.15 75 / 0.1);
--fail:oklch(0.68 0.2 25);--fail-soft:oklch(0.68 0.2 25 / 0.12);
--ok:oklch(0.76 0.13 155);--ok-soft:oklch(0.76 0.13 155 / 0.1);
--sans:"Inter Tight",Helvetica,Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
a{color:var(--accent);text-decoration:none}a:hover{color:oklch(0.82 0.12 264)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
.lbl{font-family:var(--mono);font-size:30px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

/* header */
#hdr{position:absolute;left:0;right:0;top:0;height:104px;padding:0 56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:26px}
.wm{display:inline-flex;align-items:baseline;gap:2px;font-size:42px;font-weight:600;letter-spacing:-0.03em;line-height:1}
.wm svg{display:inline-block;width:.34em;height:1em;margin:0 .01em 0 .02em;vertical-align:-.02em;overflow:visible}
.sep{width:1px;height:40px;background:var(--line2)}
.ttl{font-family:var(--mono);font-size:30px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--body)}
.claim{font-family:var(--mono);font-size:30px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.claim b{color:var(--accent);font-weight:500}
/* the tally: what actually happened, counted from events */
.mode{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:26px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.mode i{width:10px;height:10px;border-radius:99px;display:block;background:var(--dim);transition:background 600ms ease}
.mode.live i{background:var(--accent);box-shadow:0 0 12px var(--accent);animation:blink 2.2s ease-in-out infinite}
.mode .tally b{font-weight:700;color:var(--ink)}
.mode .tally .hot b{color:var(--catch)}
.mode .tally span+span::before{content:"\00b7";margin:0 12px;color:var(--line2)}
.mode .mlabel{display:none}
.mode .tally:empty+.mlabel{display:inline;color:var(--dim)}

/* now */
#now{position:absolute;left:56px;right:56px;top:128px;height:230px;transition:padding 600ms ease}
#now .lbl{display:flex;align-items:center;gap:16px}
#now .lbl i{width:12px;height:12px;border-radius:99px;background:var(--accent);display:block}
#nowText{margin:14px 0 0;font-size:72px;line-height:1.14;letter-spacing:-0.035em;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance;max-width:1760px;padding-bottom:.1em}
#nowText .c{opacity:0}#nowText .c.on{opacity:1}
#nowText .caret{display:inline-block;width:.42em;height:.9em;margin-left:.1em;vertical-align:-.08em;background:var(--accent);animation:caret 1.1s ease-in-out infinite}
#nowText.typing .caret{animation:none;opacity:1}
#now.flag #nowText .caret{background:var(--catch)}#now.fail #nowText .caret{background:var(--fail)}
#now.flag{padding-left:40px}
#now.flag::before{content:"";position:absolute;left:0;top:6px;bottom:14px;width:6px;border-radius:3px;background:var(--catch)}
#now.flag .lbl{color:var(--catch)}#now.flag .lbl i{background:var(--catch)}
#now.fail::before{background:var(--fail)}#now.fail .lbl{color:var(--fail)}#now.fail .lbl i{background:var(--fail)}

/* path: one line of words */
#path{position:absolute;left:56px;right:56px;top:378px;height:64px;display:flex;align-items:center;gap:0 36px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 4px;overflow:hidden}
.st{font-size:32px;font-weight:500;letter-spacing:-0.02em;color:var(--dim);white-space:nowrap;position:relative;padding:0 2px;transition:color 500ms ease}
.st.done{color:var(--muted)}
.st.cur{color:var(--ink)}
.st.cur::after{content:"";position:absolute;left:0;right:0;bottom:-19px;height:4px;border-radius:2px;background:var(--accent)}
.st.redo{color:var(--catch)}
#corr{margin-left:auto;font-family:var(--mono);font-size:30px;letter-spacing:.12em;text-transform:uppercase;color:var(--catch);white-space:nowrap}

/* the mind: one thought, big */
#mind{position:absolute;left:56px;right:56px;top:466px;height:392px}
#prev{height:48px;font-size:32px;line-height:48px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.015em}
#prev b{font-family:var(--mono);font-weight:400;font-size:28px;letter-spacing:.12em;text-transform:uppercase;margin-right:18px}
#cur{position:relative;margin-top:14px;height:330px;padding:26px 34px;border-left:6px solid var(--accent);background:linear-gradient(90deg,var(--accent-soft),transparent 75%);display:flex;flex-direction:column;overflow:hidden;transition:border-color 500ms ease}
#cur.split{flex-direction:row;gap:0 40px;padding:0;border-left:0;background:none}
#cur.split .half{flex:1;min-width:0;padding:22px 28px;border-left:6px solid var(--accent);background:linear-gradient(90deg,var(--accent-soft),transparent 80%);display:flex;flex-direction:column;overflow:hidden}
#cur.split .half>*{flex:none}
#cur.split .big{font-size:42px;-webkit-line-clamp:2;margin-top:12px}
#cur.split .clock{font-size:64px}
#cur.split .why{font-size:30px;-webkit-line-clamp:1;margin-top:10px}
#cur.catch{border-left-color:var(--catch);background:linear-gradient(90deg,var(--catch-soft),transparent 75%)}
#cur.fail{border-left-color:var(--fail);background:linear-gradient(90deg,var(--fail-soft),transparent 75%)}
#cur.plain{border-left-color:var(--line2);background:none}
.khd{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:30px}
.kind{font-family:var(--mono);font-size:30px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
#cur.catch .kind{color:var(--catch)}#cur.fail .kind{color:var(--fail)}#cur.plain .kind{color:var(--dim)}
.kind b{font-weight:700;color:var(--ink)}
.clock{font-family:var(--mono);font-size:96px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-0.02em}
.clock.final{color:var(--muted)}
.big{margin-top:16px;font-size:56px;line-height:1.14;letter-spacing:-0.03em;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty;padding-bottom:.08em}
.big .caret{display:inline-block;width:22px;height:52px;margin-left:12px;vertical-align:-6px;background:var(--accent);animation:caret 1s steps(1) infinite}
.why{margin-top:12px;font-size:34px;line-height:1.32;color:var(--body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty;padding-bottom:.08em}
.proof{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px 40px;font-family:var(--mono);font-size:28px;color:var(--dim);white-space:nowrap;overflow:hidden;max-height:40px}
.proof b{font-weight:400;color:var(--muted)}
.bubble{margin-top:16px;align-self:flex-start;max-width:1500px;padding:20px 30px;border-radius:28px 28px 28px 8px;background:var(--accent);color:oklch(0.14 0.01 265);font-size:44px;line-height:1.3;font-weight:500;letter-spacing:-0.02em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;padding-bottom:22px}
.bubble.in{border-radius:28px 28px 8px 28px;background:oklch(1 0 0 / 0.1);color:var(--ink);font-weight:400}

/* models: a quiet type row, no boxes */
#models{position:absolute;left:56px;right:56px;top:884px;height:168px;display:grid;grid-template-columns:repeat(3,1fr);gap:0 56px;border-top:1px solid var(--line);padding-top:22px;align-content:start}
.m{position:relative;display:flex;align-items:baseline;gap:18px;height:64px;padding-left:28px;font-family:var(--mono);font-size:32px;letter-spacing:.06em;font-weight:400;color:var(--dim);white-space:nowrap;transition:color 700ms ease,opacity 900ms ease}
#models.busy .m:not(.run){opacity:.38}
.m i{position:absolute;left:0;top:22px;width:10px;height:10px;border-radius:99px;background:transparent;border:1.5px solid var(--line2);transition:all 400ms ease}
.m .c{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--dim);font-size:28px}
.m.used{color:var(--body)}.m.used i{background:var(--muted);border-color:var(--muted)}.m.used .c{color:var(--muted)}
.m.run{color:var(--accent);font-weight:700}.m.run i{background:var(--accent);border-color:var(--accent);box-shadow:0 0 14px var(--accent);animation:blink 2.2s ease-in-out infinite}.m.run .c{color:var(--accent)}
.m.run.done{color:var(--ok)}.m.run.done i{background:var(--ok);border-color:var(--ok);box-shadow:0 0 14px var(--ok);animation:none}.m.run.done .c{color:var(--ok)}
.m.run.held{color:var(--catch)}.m.run.held i{background:var(--catch);border-color:var(--catch);box-shadow:0 0 14px var(--catch);animation:none}.m.run.held .c{color:var(--catch)}
.m.run.failed{color:var(--fail)}.m.run.failed i{background:var(--fail);border-color:var(--fail);box-shadow:0 0 14px var(--fail);animation:none}.m.run.failed .c{color:var(--fail)}
.m.err .c{color:var(--fail)}.m.err i{background:var(--fail);border-color:var(--fail)}

/* raw detail panel */
#raw{position:absolute;right:0;top:104px;bottom:0;width:900px;background:oklch(0.09 0.01 268 / 0.97);border-left:1px solid var(--line2);padding:26px 30px;display:none;flex-direction:column;gap:12px;overflow:hidden}
#raw.on{display:flex}
#raw pre{margin:0;font-family:var(--mono);font-size:24px;line-height:1.35;color:var(--body);white-space:pre-wrap;word-break:break-word;padding-bottom:12px;border-bottom:1px solid var(--line)}
#rawlist{display:flex;flex-direction:column;justify-content:flex-end;gap:12px;flex:1;overflow:hidden}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes caret{0%,45%{opacity:1}55%,100%{opacity:.3}}

/* ===== BANNER LAYOUT: 1920x300 strip across the top of the video ===== */
#stage.banner{height:312px}
.banner #hdr{height:52px;padding:0 40px}
.banner .wm{font-size:28px}.banner .sep{height:24px}.banner .ttl,.banner .claim{font-size:22px}
.banner .mode{font-size:18px;letter-spacing:.16em;gap:12px}.banner .mode i{width:8px;height:8px}.banner .mode .tally span+span::before{margin:0 10px}
.banner #now{left:40px;top:62px;width:580px;height:180px;right:auto}
.banner #now .lbl{font-size:18px;letter-spacing:.22em}.banner #now .lbl i{width:8px;height:8px}
.banner #nowText{margin-top:6px;font-size:40px;line-height:1.1;-webkit-line-clamp:3;max-width:580px;padding-bottom:.08em}
.banner #now.flag{padding-left:24px}.banner #now.flag::before{width:4px;top:4px;bottom:8px}
.banner #path{left:40px;right:auto;width:580px;top:256px;height:42px;gap:0 20px;border-bottom:0;padding:0 2px}
.banner .st{font-size:22px}.banner .st.cur::after{bottom:-9px;height:3px}
.banner #corr{font-size:22px}
.banner #mind{left:660px;right:auto;width:730px;top:62px;height:238px}
.banner #prev{display:none}
.banner #cur{margin-top:0;height:238px;padding:12px 24px;border-left-width:4px}
.banner #cur>*,.banner #cur.split .half>*{flex:none}
.banner .khd{height:auto;min-height:40px;align-items:center;gap:20px}
.banner .kind{font-size:22px;letter-spacing:.08em;display:flex;flex-direction:column;gap:2px;white-space:nowrap;overflow:visible;text-overflow:clip;line-height:1.1}
.banner .kind b{font-size:24px;letter-spacing:.06em;color:var(--accent);font-weight:700}
#cur.catch .kind b{color:var(--catch)}#cur.fail .kind b{color:var(--fail)}#cur.plain .kind b{color:var(--body)}
.banner .kind .w{font-size:18px;letter-spacing:.22em;color:var(--dim);font-weight:400}
.banner .clock{font-size:40px;color:var(--ink)}
.banner .clock.final{color:var(--dim)}
.banner .big{margin-top:6px;font-size:28px;line-height:1.12;-webkit-line-clamp:2;padding-bottom:.06em}
.banner .big .caret{width:12px;height:26px;margin-left:8px;vertical-align:-3px}
.banner .why{margin-top:3px;font-size:22px;line-height:1.18;-webkit-line-clamp:2;color:var(--muted);font-weight:400;padding-bottom:.06em}
.banner .proof{font-size:20px;gap:0;max-height:32px;line-height:1.3;padding-top:4px;margin-top:auto;color:var(--dim);letter-spacing:.02em;flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
.banner .proof b{color:var(--muted)}
.banner .proof span{flex:none}
.banner .proof span.sq{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.banner .proof span+span::before{content:"\00b7";margin:0 12px;color:var(--line2)}
.banner .also{margin-top:auto;display:flex;align-items:center;gap:14px;padding-top:8px;border-top:1px solid var(--line);font-family:var(--mono);font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden}
.banner .also::before{content:"";width:8px;height:8px;border-radius:99px;background:var(--accent);flex:none;animation:blink 2.2s ease-in-out infinite}
.banner .also .w{font-size:18px;letter-spacing:.22em;color:var(--dim)}
.banner .also b{color:var(--accent);font-weight:700}
.banner .also>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.banner .also .c2{flex:none;margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink)}
.banner .bubble{margin-top:8px;max-width:660px;padding:10px 18px;font-size:26px;line-height:1.28;-webkit-line-clamp:3;padding-bottom:12px;border-radius:20px 20px 20px 6px}
.banner .bubble.in{border-radius:20px 20px 6px 20px}
.banner #cur.split{gap:0 20px}.banner #cur.split .half{padding:12px 20px;border-left-width:4px}
.banner #cur.split .big{font-size:26px;margin-top:6px}.banner #cur.split .clock{font-size:36px}.banner #cur.split .why{display:none}
.banner #models{left:1430px;right:auto;width:450px;top:62px;height:238px;grid-template-columns:1fr;gap:0;border-top:0;padding-top:2px;align-content:start}
.banner .m{height:39px;font-size:22px;letter-spacing:.04em;padding-left:20px;gap:12px;min-width:0}
.banner .m span:first-of-type{min-width:0;overflow:hidden;text-overflow:ellipsis}
.banner .m i{top:14px;width:9px;height:9px}.banner .m .c{font-size:22px}
.banner #raw{top:52px;width:700px}
/* ===== STREAM MODE for the middle column: lines rise and fade ===== */
#cur.stream{padding:0;border-left:0;background:none;justify-content:center;gap:0}
.sl{position:relative;flex:none;padding:10px 16px 10px 18px;border-left:3px solid transparent;display:flex;flex-direction:column;gap:4px}
.sl:not(:only-child){padding:6px 16px 7px 18px;gap:2px;max-height:118px}
.sl:not(:only-child) .st{font-size:26px;line-height:1.14;-webkit-line-clamp:2}
.sl:not(:only-child) .sb{font-size:22px;line-height:1.2;padding:6px 14px;-webkit-line-clamp:2}
.sl:not(:only-child) .sp{display:none}
.sl+.sl{border-top:1px solid var(--line)}
.sl.run{border-left-color:var(--accent);background:linear-gradient(90deg,var(--accent-soft),transparent 70%)}
.sl.catch{border-left-color:var(--catch);background:linear-gradient(90deg,var(--catch-soft),transparent 70%)}
.sl.fail{border-left-color:var(--fail);background:linear-gradient(90deg,var(--fail-soft),transparent 70%)}
.sl.done{border-left-color:var(--ok);background:linear-gradient(90deg,var(--ok-soft),transparent 70%)}
.sl.done .sh .w{color:var(--ok)}
.sl.done .sh .w::before{content:"\2713\00a0";letter-spacing:0}
.sl.think .sh .w{color:var(--muted)}
.sl.think .st{font-weight:500;color:var(--body)}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.dots i{width:4px;height:4px;border-radius:99px;background:currentColor;display:block;animation:think 1.6s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes think{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
/* the status word carries the feeling */
.wd{display:inline-block;white-space:pre}
.wd i{display:inline-block;font-style:normal}
.wd-think{display:inline-flex;align-items:center;gap:12px}
.wd-think .th{display:inline-flex;gap:4px;align-items:center}
.wd-think .th i{width:5px;height:5px;border-radius:99px;background:currentColor;display:block;opacity:.3;animation:thinkdot 1.8s ease-in-out infinite}
.wd-think .th i:nth-child(2){animation-delay:.25s}.wd-think .th i:nth-child(3){animation-delay:.5s}
@keyframes thinkdot{0%,60%,100%{opacity:.3}30%{opacity:1}}
.wd-use{display:inline-flex;align-items:center;gap:12px}
.wd-use .sig{width:8px;height:8px;border-radius:99px;background:currentColor;flex:none;animation:blink 2.2s ease-in-out infinite}
.wd-ring{display:inline-flex;align-items:center;gap:12px}
.wd-ring .sig{position:relative;width:10px;height:10px;flex:none}
.wd-ring .sig::before,.wd-ring .sig::after,.wd-ring .sig i{content:"";position:absolute;inset:0;border-radius:99px;border:1.5px solid currentColor;opacity:0;animation:sonar 2.6s cubic-bezier(.2,.6,.3,1) infinite}
.wd-ring .sig::after{animation-delay:.6s}.wd-ring .sig i{animation-delay:1.2s;border:0;background:currentColor;opacity:1;animation:none;inset:3px}
@keyframes sonar{0%{transform:scale(.6);opacity:.9}100%{transform:scale(3.2);opacity:0}}
.sl.notice .sh .w{color:var(--ink)}
.sl.notice{border-left-color:var(--ink);background:linear-gradient(90deg,oklch(1 0 0 / 0.09),transparent 70%)}
.sl.notice.new{animation-duration:600ms}
.sl.notice .sb.mail{font-size:26px;padding:10px 18px;box-shadow:0 6px 24px oklch(0 0 0 / 0.35)}
.sl:not(:only-child).notice .sb.mail{font-size:24px;padding:8px 16px}
.sl .sh .lg{width:17px;height:17px;display:inline-block;vertical-align:-2px;margin-right:8px;object-fit:contain}
.sl.notice .sh b{color:var(--body)}
.wd-glance{background:linear-gradient(100deg,var(--ink) 40%,#fff 50%,var(--ink) 60%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:glance 1.4s ease-out 1 both}
@keyframes glance{from{background-position:120% 0}to{background-position:-40% 0}}
.wd-send{animation:send 700ms cubic-bezier(.2,.8,.2,1) 1 both}
@keyframes send{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.sl.done .sh .w::before{display:inline-block;animation:pop 500ms cubic-bezier(.2,1.4,.4,1) 1 both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.sl.new{animation:rise 380ms cubic-bezier(.2,.8,.2,1) both}
.sh{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:0 14px;align-items:baseline;font-family:var(--mono);white-space:nowrap;line-height:1.1}
.sh .w{font-size:18px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.sh b{font-size:24px;letter-spacing:.06em;color:var(--accent);font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sl.catch .sh b{color:var(--catch)}.sl.fail .sh b{color:var(--fail)}.sl.plain .sh b{color:var(--muted);font-weight:500;font-size:20px;letter-spacing:.04em;text-transform:none}
.sl .sb.wa{background:oklch(0.9 0.1 140);color:oklch(0.2 0.03 150);font-weight:500;padding-right:14px}
.sb .meta{display:inline-flex;align-items:center;gap:4px;margin-left:12px;vertical-align:-2px;font-size:15px;font-weight:400;color:oklch(0.45 0.03 150);font-family:var(--sans);letter-spacing:0}
.sb .tk{display:inline-flex;width:22px;height:14px;position:relative}
.sb .tk b{position:absolute;top:0;width:14px;height:14px;opacity:0;color:oklch(0.45 0.03 150)}

<script>
(function(){
const MODELS=[
 {key:'musewonder10',name:'MUSE WONDER 1.0',desc:'Judgment: the mastering plan, every setting, the critic that approves or holds'},
 {key:'musespark13',name:'MUSE SPARK 1.3',desc:'Answers, spoken commands, reading plug-in windows and hardware photos'},
 {key:'musespark12',name:'MUSE SPARK 1.2',desc:"Listens to a take and gives a producer's note"},
 {key:'musevoicetranscribe10',name:'MUSE VOICE TRANSCRIBE 1.0',desc:'Hears studio commands and takes live, transcribes calls'},
 {key:'sam31',name:'SAM 3.1',desc:'Finds the knobs in a photo, the clothes on the bed, the artist in a frame'},
 {key:'museimage10',name:'MUSE IMAGE 1.0',desc:'Paints the paper of the look board, never a piece of clothing'}
];
const DEFAULT_STAGES=['Listen','Think','Build','Test','Print','Check','Deliver'];
const FAIL=['error','failed','fail','failure','timeout','timed_out','crashed'];
const HELD=['held','hold','rejected','blocked','denied'];
const KIND_LABEL={fail:'Failed',held:'Held',leftout:'Left out',back:'Stepped back',caught:'Marco caught it'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let S;function fresh(){S={events:[],calls:new Map(),lines:[],runs:0,catches:0,plain:'',plainKind:null,stages:null,stageIdx:-1,maxIdx:-1,corr:null,runId:null,anchorTs:null,anchorWall:0,lastPushWall:0,replay:false,detail:false};}
fresh();

function toMs(v){if(v==null||v==='')return null;if(typeof v==='number')return v<1e11?v*1000:v;const n=Number(v);if(!isNaN(n))return n<1e11?n*1000:n;const d=Date.parse(v);return isNaN(d)?null:d;}
function modelKey(m){if(!m)return null;const k=String(m).toLowerCase().replace(/[^a-z0-9]/g,'');const hit=MODELS.find(x=>k===x.key||k.includes(x.key)||x.key.includes(k));return hit?hit.key:k;}
function modelOf(k,raw){return MODELS.find(x=>x.key===k)||{name:String(raw||k||'').toUpperCase(),desc:''};}
function evType(e){return String(e.type||e.kind||e.event||'').toLowerCase();}
function statusOf(e){const s=String(e.status||e.state||e.result||'').toLowerCase();const t=evType(e);
 if(s)return FAIL.includes(s)?'error':HELD.includes(s)?'held':/run|start|pending|progress/.test(s)?'running':'ok';
 if(e.error)return 'error';if(/start|begin|request/.test(t))return 'running';if(/end|finish|done|result|complete|response/.test(t))return 'ok';return null;}
function catchKind(e,st){const t=evType(e);
 if(st==='error'||/fail|error|crash/.test(t))return 'fail';
 if(st==='held'||/hold|held|reject/.test(t))return 'held';
 if(/skip|left_out|leftout|omit|exclude/.test(t))return 'leftout';
 if(/back|correct|revert|retry|redo/.test(t))return 'back';
 if(/catch|caught|self/.test(t)||e.catch||e.self_catch)return 'caught';return null;}
function msgDir(e){const t=evType(e);if(!(/message|text|sms|imessage|whatsapp|email|mail/.test(t)||e.message||e.text))return null;
 const d=String(e.direction||'').toLowerCase();return /in|user|owner|assistant|received/.test(d)||/received|incoming|inbox|email|mail/.test(t)?'in':'out';}
function vnow(){return S.anchorTs==null?Date.now():S.anchorTs+(performance.now()-S.anchorWall);}

function ingest(e){
 if(!e||typeof e!=='object')return;
 S.events.push(e);
 const ts=toMs(e.ts??e.time??e.timestamp)??vnow();
 if(S.anchorTs==null||ts>=S.anchorTs){S.anchorTs=ts;S.anchorWall=performance.now();}
 if(Array.isArray(e.stages)&&e.stages.length){S.stages=e.stages.map(String);S.stageIdx=-1;S.maxIdx=-1;S.corr=null;S.runs++;S.calls=new Map();S.catches=0;}
 if(e.run_id&&e.run_id!==S.runId){if(S.runId!=null||!Array.isArray(e.stages))S.runs++;S.runId=e.run_id;S.stageIdx=-1;S.maxIdx=-1;S.corr=null;}
 const st=statusOf(e);let ck=catchKind(e,st);const dir=msgDir(e);
 if(e.stage!=null&&e.stage!==''){
  if(!S.stages)S.stages=DEFAULT_STAGES.slice();
  let i=typeof e.stage==='number'?e.stage:S.stages.findIndex(x=>x.toLowerCase()===String(e.stage).toLowerCase());
  if(i<0){S.stages.push(String(e.stage));i=S.stages.length-1;}
  if(S.stageIdx>=0&&i<S.stageIdx){S.corr={from:S.stageIdx,to:i};if(!ck)ck='back';}
  else if(S.corr&&i>=S.corr.from)S.corr=null;
  S.stageIdx=i;S.maxIdx=Math.max(S.maxIdx,i);
 }
 if(e.call_id!=null){
  const id=String(e.call_id);let c=S.calls.get(id);
  if(!c){c={id,startTs:ts,kind:'call'};S.calls.set(id,c);S.lines.push(c);}
  for(const k in e){if(e[k]!==undefined&&e[k]!==null&&e[k]!==''&&k!=='kind')c[k]=e[k];}
  c.key=modelKey(c.model);c.status=st||c.status||'running';c.catch=ck;
  if(c.status==='running')c.startTs=Math.min(c.startTs,ts);else c.endTs=ts;
  c.touch=performance.now();
  // a finished call moves to the front so it becomes the current thought
  if(c.status!=='running'){S.lines=S.lines.filter(l=>l!==c);S.lines.push(c);}
 }else if(dir){
  const isMail=/email|mail/i.test(String(e.via||e.channel||''))||/email|mail/.test(evType(e));
  if(dir==='in'&&!isMail){/* texts the owner sends are visible in the video; not shown here */}
  else S.lines.push({kind:'msg',motif:e.motif,dir,ts,text:String(e.message||e.text||e.body||e.plain||''),from:e.from,subject:e.subject,via:e.via||e.channel||(dir==='in'?'received':'sent')});
 }else if(ck){
  S.lines.push({kind:ck,motif:e.motif,ts,text:String(e.plain||e.summary||e.error||''),detail:e.detail||'',model:e.model?modelOf(modelKey(e.model),e.model).name:null});
 }else if(e.thought||e.reason||/learn|remember|memory|noted/.test(evType(e))){
  const learned=!!(e.learned||/learn|remember|memory|noted/.test(evType(e)));
  S.lines.push({kind:learned?'learn':'thought',motif:e.motif,ts,text:String(e.thought||e.reason||e.learned||e.plain||e.text||''),detail:e.detail||''});
 }
 if(ck)S.catches++;
 if(e.plain){S.plain=String(e.plain);S.plainKind=ck;}
 if(S.lines.length>40)S.lines=S.lines.slice(-40);

 cur.innerHTML=vis.map(l=>{const isNew=l.fresh;l.fresh=false;return streamLine(l,isNew,l===lastDone);}).join('');S.typedHeard=S.typedHeard||new Set();cur.querySelectorAll('.st[data-heard]').forEach(el=>{const id=el.dataset.heard;if(S.typedHeard.has(id))return;S.typedHeard.add(id);typeInto(el,el.textContent);});cur.querySelectorAll('.st.ear').forEach(st=>{const sl=st.parentElement;sl.classList.add('ear');const w=sl.querySelector('.sh .w'),b=sl.querySelector('.sh b'),bars=st.querySelector('.bars');if(!w||!b||!bars)return;const u=($('stage').getBoundingClientRect().width/DIMS[layout][0])||1;const s0=st.getBoundingClientRect().left;const wf=parseFloat(getComputedStyle(w).fontSize)||18,bf=parseFloat(getComputedStyle(b).fontSize)||24;const left=(w.getBoundingClientRect().left-s0)/u+wf*0.85;const right=(b.getBoundingClientRect().right-s0)/u-bf*0.66*6;bars.style.marginLeft=left+'px';bars.style.width=Math.max(120,right-left)+'px';});fitText(cur);tick();}
function renderModels(){const calls=[...S.calls.values()];const shown=[...S.calls.values()].filter(l=>l.status==='running').concat((S.slots||[]).filter(l=>l&&l.kind==='call'));const active=new Map();shown.forEach(l=>{const st=l.status==='running'?'':l.status==='error'?' failed':l.status==='held'?' held':' done';if(!active.has(l.key)||st==='')active.set(l.key,st);});const busy=active.size>0;$('models').classList.toggle('busy',busy);
 $('models').innerHTML=MODELS.map(m=>{const mine=calls.filter(c=>c.key===m.key);const run=active.has(m.key);const tone=run?active.get(m.key):'';
  const last=mine.slice().sort((a,b)=>(a.touch||0)-(b.touch||0)).pop();const err=!run&&last&&last.status==='error';
  return '<div class="m'+(run?' run'+tone:'')+(mine.length?' used':'')+(err?' err':'')+'"><i></i><span>'+m.name+'</span><span class="c">'+(mine.length?mine.length:'')+'</span></div>';}).join('');}

function renderRaw(){$('raw').classList.toggle('on',S.detail);if(!S.detail)return;$('rawlist').innerHTML=S.events.slice(-8).map(e=>'<pre>'+esc(JSON.stringify(e))+'</pre>').join('');}
function modeOf(){if(S.replay)return 'replay';if(!S.events.length)return 'idle';const running=[...S.calls.values()].some(c=>c.status==='running');return running||performance.now()-S.lastPushWall<20000?'live':'idle';}
function renderMode(){const m=modeOf();const el=$('mode');const n=[...S.calls.values()].filter(c=>MODELS.some(m=>m.key===c.key)).length;const t=$('tally');const parts=[];if(n)parts.push('<span><b>'+n+'</b> '+(n===1?'call':'calls')+'</span>');if(S.catches)parts.push('<span class="hot"><b>'+S.catches+'</b> '+(S.catches===1?'catch':'catches')+'</span>');const h=parts.join('');if(t.innerHTML!==h)t.innerHTML=h;if(el.dataset.m===m)return;el.dataset.m=m;el.className='mode '+m;el.setAttribute('aria-label',m.toUpperCase());el.querySelector('.mlabel').textContent=m.toUpperCase();}
function fitText(root){root.querySelectorAll('#nowText,.sl .st,.sl .sb:not(.mail),.sb.mail .mt').forEach(el=>{el.style.fontSize='';const base=parseFloat(getComputedStyle(el).fontSize);let fs=base;const min=Math.max(22,base*0.72);while(el.scrollHeight>el.clientHeight+2&&fs-2>=min){fs-=2;el.style.fontSize=fs+'px';}});}
function render(){renderNow();renderPath();renderMind();renderModels();renderRaw();renderMode();fitText(document);}
function tick(){const now=vnow();document.querySelectorAll('[data-clock]').forEach(el=>{el.textContent=fmtClock(now-Number(el.dataset.clock));});}

let fixedScale=null,layout='banner',mindMode='stream';
const DIMS={full:[1920,1080],banner:[1920,312]};
function fit(){const [W,H]=DIMS[layout];const u=fixedScale||Math.min(innerWidth/W,innerHeight/H);const st=$('stage');st.classList.toggle('banner',layout==='banner');st.style.transform='scale('+u+')';st.style.left=Math.max(0,(innerWidth-W*u)/2)+'px';st.style.top=Math.max(0,(innerHeight-H*u)/2)+'px';}
layout=(new URLSearchParams(location.search).get('layout')==='full')?'full':'banner';
mindMode=(new URLSearchParams(location.search).get('mind')==='focus')?'focus':'stream';
addEventListener('resize',fit);fit();

window.marco={
 push(events){const arr=Array.isArray(events)?events:[events];arr.forEach(ingest);S.lastPushWall=performance.now();render();},

 scale(u){fixedScale=(u==null||u===false)?null:Number(u)||null;fit();},

};
