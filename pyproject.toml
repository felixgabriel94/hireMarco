[project]
name = "hiremarco"
version = "0.1.0"
description = "Marco, a personal assistant on Muse Spark who watches your texts, offers to handle what he can, and proves it. Built for the Meta Global AI Developer Hackathon, Oct 26 to Nov 4, 2026."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "aiortc>=1.15.0",
  "httpx>=0.27",
  "librosa>=1.0.0",
  "mido>=1.3",
  "numpy>=2.0",
  "pyobjc-framework-quartz>=10",
  "pyobjc-framework-screencapturekit>=10",
  "python-rtmidi>=1.5",
  "scipy>=1.13",
  "sounddevice>=0.5",
  "soundfile>=0.12",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "websockets>=13",
]

[project.scripts]
marco = "hiremarco.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hiremarco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
